services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: scrapbook
            POSTGRES_USER: scrapbook
            POSTGRES_PASSWORD: 246810
        ports:
            - "5433:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U scrapbook -d scrapbook"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: scrapbook
            MINIO_ROOT_PASSWORD: scrapbook-secret
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio-data:/data

volumes:
    minio-data:
    postgres-data:
    redis-data:
