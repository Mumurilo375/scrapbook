services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
        entrypoint: ["docker/app/start.sh"]
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: "http://localhost:${APP_PORT:-8000}"
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: scrapbook
            DB_USERNAME: scrapbook
            DB_PASSWORD: 246810
            SESSION_DRIVER: database
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: predis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            FILESYSTEM_DISK: s3
            AWS_ACCESS_KEY_ID: scrapbook
            AWS_SECRET_ACCESS_KEY: scrapbook-secret
            AWS_DEFAULT_REGION: us-east-1
            AWS_BUCKET: scrapbook
            AWS_URL: http://localhost:9000/scrapbook
            AWS_ENDPOINT: http://minio:9000
            AWS_USE_PATH_STYLE_ENDPOINT: "true"
            RUN_MIGRATIONS: "true"
            COMPOSER_CACHE_DIR: /tmp/composer
            SYNC_DOCKER_ENV: "true"
        ports:
            - "${APP_PORT:-8000}:8000"
        volumes:
            - .:/var/www/html
            - composer-cache:/tmp/composer
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_started

    vite:
        image: node:22-alpine
        user: "${UID:-1000}:${GID:-1000}"
        working_dir: /var/www/html
        command: sh -c "npm ci && rm -f public/hot && npm run build && npx vite preview --host 0.0.0.0 --port $${VITE_PORT:-5173}"
        environment:
            NPM_CONFIG_CACHE: /tmp/.npm
            VITE_APP_NAME: Scrapbook
            VITE_PORT: "${VITE_PORT:-5173}"
        ports:
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        volumes:
            - .:/var/www/html
            - node-modules:/var/www/html/node_modules
        depends_on:
            - app

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        command: ["php", "artisan", "queue:listen", "--tries=1", "--timeout=0"]
        entrypoint: ["docker/app/start.sh"]
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: "http://localhost:${APP_PORT:-8000}"
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: scrapbook
            DB_USERNAME: scrapbook
            DB_PASSWORD: 246810
            SESSION_DRIVER: database
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: predis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            FILESYSTEM_DISK: s3
            AWS_ACCESS_KEY_ID: scrapbook
            AWS_SECRET_ACCESS_KEY: scrapbook-secret
            AWS_DEFAULT_REGION: us-east-1
            AWS_BUCKET: scrapbook
            AWS_URL: http://localhost:9000/scrapbook
            AWS_ENDPOINT: http://minio:9000
            AWS_USE_PATH_STYLE_ENDPOINT: "true"
            RUN_MIGRATIONS: "false"
            COMPOSER_CACHE_DIR: /tmp/composer
            SYNC_DOCKER_ENV: "true"
        volumes:
            - .:/var/www/html
            - composer-cache:/tmp/composer
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: scrapbook
            POSTGRES_USER: scrapbook
            POSTGRES_PASSWORD: 246810
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U scrapbook -d scrapbook"]
            interval: 5s
            timeout: 5s
            retries: 10

    postgres_test:
        image: postgres:16-alpine
        profiles: ["testing"]
        environment:
            POSTGRES_DB: scrapbook_testing
            POSTGRES_USER: scrapbook
            POSTGRES_PASSWORD: 246810
        ports:
            - "${POSTGRES_TEST_PORT:-55432}:5432"
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U scrapbook -d scrapbook_testing"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: scrapbook
            MINIO_ROOT_PASSWORD: scrapbook-secret
        ports:
            - "${MINIO_API_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_PORT:-9001}:9001"
        volumes:
            - minio-data:/data

    minio-init:
        image: minio/mc:latest
        depends_on:
            - minio
        entrypoint: >
            /bin/sh -c "
            until mc alias set local http://minio:9000 scrapbook scrapbook-secret; do sleep 2; done;
            mc mb --ignore-existing local/scrapbook;
            mc anonymous set download local/scrapbook;
            "

volumes:
    composer-cache:
    minio-data:
    node-modules:
    postgres-data:
    redis-data:
